status = "manual"

[usb.bulk_out_endpoints]
value = 1
source = "trm"
page = 22
evidence = "There is 1 input bulk endpoint and 1 output bulk endpoint."
status = "manual"

[usb.packet_size]
value = 64
unit = "bytes"
source = "trm"
page = 22
