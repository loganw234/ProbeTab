# protocol/labpro-facts.toml
#
# The single source for facts about the LabPro. Code takes values from here, or
# from files generated from here, and never retypes them. A document may restate
# a value for its reader, beside its page; this file wins any disagreement, and
# no gate compares the two.
#
# Each fact is a table with:
#   value     the fact
#   unit      what the value measures, where it has a unit
#   source    a key under [source]
#   page      the source's PDF page. On the pages these fields cite, the
#             manual's printed page numbers match. Its appendices are numbered
#             apart, from the PDF's page 78: A-1, then B-1 and on
#   evidence  the words on that page that state the fact; tools/check.py finds
#             them on the page when the manual is present
#   status    "manual": read from the source, not yet seen on a bench
#             "bench":  confirmed on a LabPro; `trace` names the recorded trace
#             in protocol/traces/
#   note      what a reader would otherwise get wrong
#
# A fact moves from "manual" to "bench" only with a recorded trace.

[source.trm]
title = "LabPro Technical Reference Manual"
publisher = "Vernier Software & Technology"
revision = "08/02/02"
bytes = 414165
sha256 = "41c66c8daaf359dc423959b17191d372cb77d9ce51d160317d5bf63188d289cd"
local = "labpro_tech_manual.pdf"
url = "http://www2.vernier.com/labpro/labpro_tech_manual.pdf"
note = "The owner's copy, kept in the repository folder and ignored by git; never committed. The URL is where the project outline cites the manual; the pinned copy was not fetched from it. The revision is the date in the manual's page headers."

