# Sampling. The manual has two modes: real time (RT), where each sample is
# sent as it is taken, and non-real time (NRT), where samples are stored in the
# LabPro and fetched afterwards. The project outline's "burst capture" is NRT.

[buffer.points]
value = 12000
unit = "samples, shared by the active channels"
source = "trm"
page = 24
evidence = "the number of data points being collected is limited to 12k samples/# of channels."
status = "manual"
note = "The page says 12k, read here as 12,000, as pages 12, 27, 51, 59 and 81 write it. Command 3 allows up to 12,287 (page 35; see collection.max_points)."

[realtime.usb_max_rate]
value = 1000
unit = "samples per second, 1 to 6 channels"
source = "trm"
page = 24
evidence = "we should have a limit of 1k samples per second for RT mode for 1 to 6 channels active."
status = "manual"
note = "The manual's estimate for an unloaded USB bus, not a measurement. Page 23 says real-time binary data goes one sample per 64-byte USB packet by default, roughly 1 sample/ms; that this is the reason for the limit is the lead's reading."

[[realtime.serial_max_rate]]
channels = "1"
value = 500
unit = "samples per second"
source = "trm"
page = 23
evidence = "500 samples per second max. 1 channel active"
status = "manual"

[[realtime.serial_max_rate]]
channels = "2 - 4"
value = 250
unit = "samples per second"
source = "trm"
page = 23
evidence = "250 samples per second max. 2 - 4 channels active"
status = "manual"

[[realtime.serial_max_rate]]
channels = "4 - 6"
value = 200
unit = "samples per second"
source = "trm"
page = 23
evidence = "200 samples per second max. 4 - 6 channels active"
status = "manual"
note = "The table names 4 channels in two rows. Computed by the lead, 2026-11-15: by the page's own arithmetic (2 x channels + 5 bytes a point, at 3840 bytes a second) 5 channels allow 256 points a second, so 250 would hold up to 5 channels and only 6 would need 200. The bench decides."

[[non_realtime.max_rate]]
channels = "1"
value = 50000
unit = "samples per second"
source = "trm"
page = 24
evidence = "50K samples per second max. 1 channel active"
status = "manual"

[[non_realtime.max_rate]]
channels = "2"
value = 5000
unit = "samples per second"
source = "trm"
page = 24
evidence = "5k samples per second max. 2 channels active"
status = "manual"

[[non_realtime.max_rate]]
channels = "3 - 4"
value = 2500
unit = "samples per second"
source = "trm"
page = 24
evidence = "2.5k samples per second max. 3-4 channels active"
status = "manual"

[[non_realtime.max_rate]]
channels = "5"
value = 2000
unit = "samples per second"
source = "trm"
page = 24
evidence = "2k samples per second max. 5 channels active"
status = "manual"

[[non_realtime.max_rate]]
channels = "6"
value = 1000
unit = "samples per second"
source = "trm"
page = 24
evidence = "1k samples per second max. 6 channels active"
status = "manual"

